# ShopAI docker-compose stack.
#
# Default services (minimal — runs on any Windows/Mac/Linux with
# Docker Desktop, ~500 MB total download):
#   shopai-daemon  — autonomous cycle loop
#   shopai-api     — HTTP API server (port 8080)
#   cloudflared    — public https tunnel for Shopify webhooks
#
# Cloud LLMs (Groq / Gemini / DeepSeek) are called directly via
# API keys in .env — no local model needed by default. First-run
# is fast + lightweight.
#
# Optional profiles:
#   --profile ollama  → adds local LLM server (~15 GB model pulls)
#   --profile gpu     → NVIDIA-accelerated Ollama (implies ollama)
#
# Usage (Windows / Mac / Linux desktop):
#     cp .env.example .env
#     # edit .env — at minimum SHOPAI_SHOPIFY_URL + SHOPAI_SHOPIFY_KEY
#     docker compose up -d
#     # Find the public webhook URL:
#     docker compose logs cloudflared | grep trycloudflare
#     # Put that URL in .env as SHOPAI_WEBHOOK_CALLBACK_URL and
#     # restart: docker compose up -d --force-recreate shopai-daemon
#
# Local LLM (optional, large download):
#     docker compose --profile ollama up -d
#
# GPU acceleration (NVIDIA only):
#     docker compose --profile gpu up -d

services:
  shopai-daemon:
    build: .
    image: shopai:latest
    container_name: shopai-daemon
    command: ["daemon"]
    env_file: .env
    environment:
      SHOPAI_ENV: production
      SHOPAI_LOG_FORMAT: json
      SHOPAI_OLLAMA_URL: http://ollama:11434
    volumes:
      - shopai_data:/app/data
      - shopai_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      disable: true

  shopai-api:
    build: .
    image: shopai:latest
    container_name: shopai-api
    command: ["api"]
    env_file: .env
    environment:
      SHOPAI_ENV: production
      SHOPAI_LOG_FORMAT: json
      SHOPAI_OLLAMA_URL: http://ollama:11434
    ports:
      - "8080:8080"
    volumes:
      - shopai_data:/app/data
      - shopai_logs:/app/logs
    depends_on:
      shopai-daemon:
        condition: service_started
    restart: unless-stopped

  # Public https tunnel — Shopify webhooks POST to this URL and the
  # request reaches shopai-api:8080. Free, no auth token required
  # (random trycloudflare.com subdomain on each start). For a stable
  # subdomain swap this command for `cloudflared tunnel run <name>`
  # with a Cloudflare account.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shopai-tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://shopai-api:8080
    depends_on:
      shopai-api:
        condition: service_started
    restart: unless-stopped

  # Ollama is OPT-IN via `--profile ollama up -d`. Default
  # ShopAI stack skips local LLM and uses cloud APIs (Groq /
  # Gemini / DeepSeek) configured in .env. This keeps first-
  # run download size to ~500 MB instead of ~15 GB and avoids
  # the ollama-health-on-WSL2 cold-start issues.
  ollama:
    image: ollama/ollama:latest
    container_name: shopai-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # ollama CLI is guaranteed present inside the image;
      # `ollama list` returns 0 only when the server is up.
      # `wget` is NOT shipped in ollama/ollama so the previous
      # wget-based check failed immediately on Windows Docker
      # Desktop. Bumped start_period to 90s — first boot on
      # WSL2 + slow disk can exceed 30s.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # GPU-enabled Ollama (NVIDIA only). Activated by:
  #     docker compose --profile gpu up -d
  # When this profile is active the plain `ollama` service above
  # is still the one referenced; Docker Compose merges profiles
  # cumulatively, so rename / override via docker-compose.gpu.yml
  # if you need a second Ollama instance. For the common case
  # (optional GPU boost) we expose the profile purely as a flag
  # users can run `docker compose --profile gpu up -d` with, which
  # then requires the NVIDIA Container Toolkit on the host.
  ollama-gpu:
    extends:
      service: ollama
    image: ollama/ollama:latest
    container_name: shopai-ollama-gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]

  ollama-init:
    image: ollama/ollama:latest
    container_name: shopai-ollama-init
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      SHOPAI_OLLAMA_MODELS: ${SHOPAI_OLLAMA_MODELS:-mistral qwen2.5 llama3.2}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "[ollama-init] waiting for ollama at ollama:11434..."
        until OLLAMA_HOST=http://ollama:11434 ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "[ollama-init] ollama is up; pulling models: $$SHOPAI_OLLAMA_MODELS"
        for model in $$SHOPAI_OLLAMA_MODELS; do
          echo "[ollama-init] pulling $$model..."
          OLLAMA_HOST=http://ollama:11434 ollama pull "$$model" || \
            echo "[ollama-init] WARN: failed to pull $$model (continuing)"
        done
        echo "[ollama-init] done. Installed models:"
        OLLAMA_HOST=http://ollama:11434 ollama list || true
    restart: "no"

volumes:
  shopai_data:
  shopai_logs:
  ollama_models:
