name: ShopAI CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same
# branch / PR — we only care about the latest state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest (full suite)
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          SHOPAI_LOG_LEVEL: WARNING
          SHOPAI_SKIP_CONFIG_CHECK: "1"
        run: |
          set -o pipefail
          pytest tests/ --tb=long -v 2>&1 | tee /tmp/pytest-output.txt

      - name: Post failure details as PR comment
        if: failure() && steps.pytest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the PR number for current branch (works for both push and PR events)
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "0" ]; then
            PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --json number -q '.[0].number' 2>/dev/null || true)
          fi
          echo "PR_NUM=$PR_NUM"
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            # Write body to temp file to avoid shell escaping issues
            {
              echo "## CI Test Failures (py${{ matrix.python-version }})"
              echo '```'
              tail -100 /tmp/pytest-output.txt || true
              echo '```'
            } > /tmp/pr-comment-body.md
            gh pr comment "$PR_NUM" --body-file /tmp/pr-comment-body.md || echo "Failed to post PR comment"
          else
            echo "No PR found for branch ${{ github.ref_name }}"
          fi

      - name: Summarize failures
        if: failure() && steps.pytest.outcome == 'failure'
        run: |
          echo "## Test Failures (py${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/pytest-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Engine import check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from engines.registry import engine_count, list_engines
          import importlib
          errors = []
          for n in list_engines():
              try:
                  importlib.import_module(f'engines.{n}')
              except Exception as e:
                  errors.append(f'{n}: {e}')
          print(f'Engines: {engine_count()}, Import errors: {len(errors)}')
          if errors:
              for e in errors[:5]: print(f'  {e}')
              exit(1)
          "

      - name: Dispatcher coverage audit (Pattern K)
        # Cross-references every action_type engines enqueue
        # against the registered dispatcher table. Missing
        # dispatchers cause silent execute-time failures (the
        # action gets auto-marked FAILED with "no executor
        # registered"). Required gate — every enqueued
        # action_type MUST have a registered dispatcher.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py approvals audit

      - name: OAuth scope coverage audit
        # Cross-references every Shopify adapter against its
        # `required_scopes` / `scope_independent` declarations.
        # Missing declarations would make the operator install
        # manifest incorrect — over-requesting (Shopify review
        # rejects) or under-requesting (ACCESS_DENIED at first
        # live call). Required gate — every registered adapter
        # MUST declare one of: a non-empty `required_scopes`
        # frozenset, OR `scope_independent = True` for context-
        # dependent / app-level surfaces.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py shopify-scopes-audit

      - name: Capability coverage audit (Pattern Y)
        # Cross-references every Capability.SHOPIFY_* enum value
        # against the registered adapters. Missing claims = engines
        # routing into a void (AdapterNotConfigured). Orphan claims =
        # adapter declares a capability that doesn't exist on the
        # enum (typo trap). Required gate — every enum value MUST
        # be claimed by 1+ adapter.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py capabilities-audit

      - name: Pattern Q engine envelope audit
        # Every registered engine's run() must return the
        # canonical {status, data, meta, error} envelope. This
        # is a RUNTIME audit (it actually calls each engine
        # with empty input) because envelope dicts are computed
        # dynamically and an AST walk can't verify them.
        # Catches refactors that drop one of the four keys --
        # downstream consumers (approval queue narrative,
        # Phase 8 recorder, recommender) all assume the
        # envelope.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py pattern-q-audit

      - name: Pattern Z writer-recorder audit
        # Every writer module (*_applier.py / *_minter.py /
        # *_payer.py) that calls a Shopify mutation MUST also
        # call record_writeback so Phase 8 sees the outcome.
        # Catches the bug class fixed in PR #205 where four
        # minters silently skipped the autonomous learning loop.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py pattern-z-audit

      - name: Phase 7 wireup resolution audit
        # Runtime smoke-test that every wired engine's
        # apply_* opt-in flag resolves cleanly (writeback
        # audit catches AST-level bugs; this catches the
        # subtler class where a writer file is present +
        # named correctly but flow.py raises on import, or
        # the opt-in flag is missing despite the writer
        # existing). Dry-run only -- no Shopify mutations,
        # no engine invocation; just resolves apply_* per
        # wired engine.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py engine try-wireup --all

      - name: Pattern J test-pollution audit
        # Every write to MemoryIntelligence / DataArchitecture /
        # LearningLoop must come from the canonical Phase 8
        # recorder (which gates on PYTEST_CURRENT_TEST) or be in
        # a module that defines its own _is_test_environment
        # guard. Catches the bug class documented in CLAUDE.md
        # Pattern J: test code that hits an unguarded path
        # pollutes on-disk SQLite, then the failure-intelligence
        # pipeline auto-generates avoidance rules from test
        # fixtures.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py pattern-j-audit

      - name: Engine capability parity audit (Pattern I)
        # Cross-references every `capability_name=` string literal
        # in engines/**/*.py against the Capability enum AND the
        # adapter registry. Catches PR-#40-class bugs: an engine
        # hydrator using a capability name that exists on the enum
        # but no adapter claims (silent unroutable), or a name
        # that doesn't exist on the enum at all (typo trap that
        # mocked tests miss because they patch the router).
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py engines-capability-audit

      - name: Cluster topology + risk taxonomy audit
        # 9th institutional gate. Protects the Tier 2b ant-colony
        # substrate against drift: dropped cluster, multi-cluster
        # engine, unknown-risk writer, ballooning destructive
        # count, additive/modification ratio collapse.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py audit --only cluster_topology

      - name: Deployable config dry-run (prepare-deploy)
        # End-to-end gate: every required institutional protection
        # check passes AND the deployable shopify.app.toml emits
        # cleanly. Catches an integration class the individual
        # audits miss — e.g. a scope name with embedded quotes,
        # a webhook topic with special chars in the registry, or
        # a registry-side oversight where collect_manifest() raises.
        # Uses --skip-live (CI can't reach Shopify) but every
        # other section must pass.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py shopify-prepare-deploy \
            --skip-live \
            --output /tmp/ci-shopify.app.toml \
            --force \
            --app-host https://shopai-ci.example.com
          # Sanity-check the file actually rendered something
          test -s /tmp/ci-shopify.app.toml
          grep -q "\[access_scopes\]" /tmp/ci-shopify.app.toml
          grep -q "\[webhooks\]" /tmp/ci-shopify.app.toml

      - name: Release-bundle dry-run (capstone)
        # End-to-end gate for the deploy-day capstone command.
        # release-bundle re-uses snapshot + catalog --markdown +
        # shopify-app-toml + the doctor, so this single CI step
        # exercises every existing artifact-generation path in
        # one shot. If the capstone breaks, a deploy-day run by
        # an operator would also break -- catch it in CI.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python cli.py release-bundle \
            --skip-live \
            --output /tmp/ci-release \
            --force \
            --app-host https://shopai-ci.example.com
          # Every artifact present
          test -s /tmp/ci-release/snapshot.json
          test -s /tmp/ci-release/catalog.md
          test -s /tmp/ci-release/shopify.app.toml
          test -s /tmp/ci-release/doctor.txt
          test -s /tmp/ci-release/README.md
          # JSON snapshot is valid
          python -c "import json; json.load(open('/tmp/ci-release/snapshot.json'))"
          # README links each artifact
          grep -q "snapshot.json" /tmp/ci-release/README.md
          grep -q "catalog.md" /tmp/ci-release/README.md
          grep -q "shopify.app.toml" /tmp/ci-release/README.md

      - name: Config schema validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Validate the schema itself loads and reports cleanly on
          # an empty env (no .env file present in CI).
          python -c "
          from infrastructure.config.schema import validate_config, get_config_report
          result = validate_config()
          if result.errors:
              print('Config schema errors:')
              for e in result.errors:
                  print(f'  {e}')
              exit(1)
          rows = get_config_report()
          print(f'Config schema: {len(rows)} fields validated')
          "

      - name: DB migration dry-run
        env:
          PYTHONPATH: ${{ github.workspace }}
          SHOPAI_DATA_DIR: /tmp/shopai-ci-data
        run: |
          mkdir -p /tmp/shopai-ci-data
          # Construct every DB and verify the migration framework
          # applies cleanly on a fresh data directory.
          python -c "
          from core.memory.intelligence import MemoryIntelligence
          from core.brain.memory import IntelligentMemory
          from data_pipeline.store.db import ShopAIDatabase
          from core.system.ab_testing import ABTestingFramework
          from core.ai.experience import ExperienceAccumulator
          from core.data.architecture import DataArchitecture
          from data_pipeline.tracking.event_collector import EventCollector
          from data_pipeline.tracking.price_history import PriceHistory
          from core.system.store_registry import StoreRegistry
          from models.rl.pricing_agent import PricingAgent
          from core.db.migrations import get_all_schema_info
          MemoryIntelligence(); IntelligentMemory(); ShopAIDatabase()
          ABTestingFramework(); ExperienceAccumulator(); DataArchitecture()
          EventCollector(); PriceHistory(); StoreRegistry(); PricingAgent()
          for info in get_all_schema_info():
              print(f'{info[\"name\"]:25s} v{info[\"current_version\"]}/{info[\"target_version\"]} {info[\"status\"]}')
              assert info['status'] == 'up_to_date', f'{info[\"name\"]} not up to date'
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shopai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
