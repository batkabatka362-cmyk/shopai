name: ShopAI CI

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=. python tests/run_tests.py

      - name: Engine import check
        run: |
          PYTHONPATH=. python -c "
          from engines.registry import engine_count, list_engines
          import importlib
          errors = []
          for n in list_engines():
              try:
                  importlib.import_module(f'engines.{n}.engine')
              except Exception as e:
                  errors.append(f'{n}: {e}')
          print(f'Engines: {engine_count()}, Import errors: {len(errors)}')
          if errors:
              for e in errors[:5]: print(f'  {e}')
              exit(1)
          "

      - name: System health check
        run: |
          PYTHONPATH=. python -c "
          from core.self_monitor import HealthChecker
          h = HealthChecker().check_all()
          print(f'Health: {h[\"status\"]}')
          if h['status'] != 'healthy':
              print(h)
              exit(1)
          "
